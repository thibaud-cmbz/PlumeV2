services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: plume
      POSTGRES_PASSWORD: plume
      POSTGRES_DB: plume
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plume -d plume"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
