[project]
name = "plume-core"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16",
    "httpx>=0.28",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "tenacity>=9.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
